<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche – Swiply (démo)</title>
    <link rel="icon" href="images/logos/logo.png">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="js/db.js"></script>
</head>
<body class="flex flex-col min-h-screen">
<div class="flex flex-col bg-gradient-to-b from-[#99C2A8] to-[#78AB88] min-h-screen">
    <main class="flex-grow flex flex-col items-center pt-32 px-4 md:px-8 pb-20">
        <form id="searchForm" class="w-full max-w-2xl flex flex-col items-center">
            <div class="w-full">
                <input type="text" name="query" id="query" placeholder="Rechercher par nom (ex. Capgemini, Lucas…)"
                       class="w-full py-4 px-8 rounded-full shadow-inner bg-gray-50/90 text-gray-800 text-xl border-none focus:ring-2 focus:ring-white/50">
            </div>
            <div class="mt-6 bg-white/90 px-6 md:px-12 py-3 rounded-full shadow-lg flex flex-wrap justify-center gap-x-10 gap-y-2">
                <label class="flex items-center space-x-3 cursor-pointer"><input type="radio" name="type" value="company" class="w-5 h-5 accent-slate-700" checked><span class="text-lg text-gray-700 font-medium">Entreprise</span></label>
                <label class="flex items-center space-x-3 cursor-pointer"><input type="radio" name="type" value="student" class="w-5 h-5 accent-slate-700"><span class="text-lg text-gray-700 font-medium">Etudiant</span></label>
                <label class="flex items-center space-x-3 cursor-pointer"><input type="radio" name="type" value="pilote" class="w-5 h-5 accent-slate-700"><span class="text-lg text-gray-700 font-medium">Pilote</span></label>
            </div>
            <button type="submit" class="mt-6 px-8 py-2 bg-[#2D3748] text-white rounded-full">Rechercher</button>
        </form>

        <div class="w-full max-w-6xl mt-10" id="countWrap" hidden>
            <div class="inline-block bg-white/90 px-8 py-2 rounded-2xl shadow-md border border-white/20">
                <span class="text-gray-600 text-lg italic" id="count"></span>
            </div>
        </div>
        <div class="w-full max-w-7xl mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10" id="results"></div>
    </main>
</div>
<script src="js/layout.js"></script>
<script>
    const form = document.getElementById('searchForm');
    const params = new URLSearchParams(location.search);
    form.query.value = params.get('query') || '';
    form.querySelector(`input[name=type][value="${params.get('type') || 'company'}"]`)?.click();
    form.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', () => form.requestSubmit()));

    const avatar = `<svg class="w-16 h-16 text-[#4B5563]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>`;

    function run() {
        const type = form.type.value;
        const results = SwiplyDB.search(form.query.value, type);
        document.getElementById('countWrap').hidden = !form.query.value.trim();
        document.getElementById('count').textContent = `Nombre de résultat : ${results.length}`;
        document.getElementById('results').innerHTML = results.map(u => {
            const name = u.company_name || `${u.first_name} ${u.last_name}`;
            const sub = u.role_id === 4 ? (SwiplyDB.city(u.cities_id)?.name || '') : (SwiplyDB.school(u.schools_id)?.name || '');
            const inner = `
                <div class="w-20 h-20 md:w-28 md:h-28 bg-[#D1D5DB] rounded-full flex-shrink-0 flex items-center justify-center shadow-inner overflow-hidden">${avatar}</div>
                <div class="min-w-0"><div class="text-2xl md:text-3xl font-normal text-gray-800 truncate">${esc(name)}</div><div class="text-gray-700 truncate">${esc(sub)}</div></div>`;
            const cls = 'block bg-[#A3C9B1] rounded-[50px] p-6 md:p-8 flex items-center gap-6 md:gap-8 shadow-[0_15px_30px_-5px_rgba(0,0,0,0.2)] border-t border-white/30';
            // Seuls les profils entreprise ont une page dans cette démo
            return u.role_id === 4
                ? `<a href="entreprise.html?id=${u.id}" class="${cls} hover:scale-105 transition-transform">${inner}</a>`
                : `<div class="${cls}">${inner}</div>`;
        }).join('');
    }

    form.addEventListener('submit', e => {
        e.preventDefault();
        const p = new URLSearchParams({ query: form.query.value, type: form.type.value });
        history.replaceState(null, '', '?' + p);
        run();
    });
    SwiplyDB.load().then(() => {
        if (!form.query.value) form.query.value = '';
        run();
    });
</script>
</body>
</html>
